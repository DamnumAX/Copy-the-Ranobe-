name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RanobeSaver-cloud-build.zip'
      - '.github/workflows/android.yml'
      - 'patch_pause.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Unpack Android project
        run: |
          unzip -q RanobeSaver-cloud-build.zip
          test -f RanobeSaver/settings.gradle.kts
      - name: Add pause and captcha handling
        run: python3 patch_pause.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: RanobeSaver
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RanobeSaver-debug-apk
          path: RanobeSaver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
